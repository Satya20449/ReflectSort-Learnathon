[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflectsort-integrated"
version = "1.0.0"
description = "ReflectSort — Explainable Optical Mini-Sorting Cell Prototype"
readme = "README.md"
authors = [
    { name = "Satya Nayak", email = "satya.lead@reflectsort.local" },
    { name = "Kuldeep Singh", email = "kuldeep.ml@reflectsort.local" },
    { name = "Satyam Rai", email = "satyam.app@reflectsort.local" },
    { name = "Ajitesh Karan", email = "ajitesh.member4@reflectsort.local" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.3.0",
    "pyserial>=3.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests", "member4_system/tests"]
pythonpath = [".", "member4_system/src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sklearn.exceptions.InconsistentVersionWarning"
]
